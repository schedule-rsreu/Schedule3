apiVersion: apps/v1
kind: Deployment
metadata:
  name: schedule3
  labels:
    app.kubernetes.io/name: schedule3
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: schedule3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schedule3
        logs.vingp.dev/enabled: "true"
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: schedule3
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: schedule3
  labels:
    app.kubernetes.io/name: schedule3
spec:
  selector:
    app.kubernetes.io/name: schedule3
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: schedule3
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: schedule3
                port:
                  name: http
    {{- end }}
{{- end }}
