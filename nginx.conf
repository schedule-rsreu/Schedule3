error_log /dev/stderr notice;

events {}

http {
  include /etc/nginx/mime.types;

  log_format json escape=json '{"timestamp":"$time_iso8601",'
                              '"remote_addr":"$remote_addr",'
                              '"x_forwarded_for":"$http_x_forwarded_for",'
                              '"method":"$request_method",'
                              '"request_uri":"$request_uri",'
                              '"status":$status,'
                              '"bytes_sent":$body_bytes_sent,'
                              '"request_time":$request_time,'
                              '"referer":"$http_referer",'
                              '"user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  brotli on;
  brotli_comp_level 6;
  brotli_min_length 1024;
  brotli_types text/css text/javascript application/javascript application/json image/svg+xml;

  zstd on;
  zstd_comp_level 3;
  zstd_min_length 1024;
  zstd_types text/css text/javascript application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    location ^~ /assets/fonts/ {
      add_header Cache-Control "public, max-age=2592000";
      try_files $uri =404;
    }

    location ~ "^/assets/.+-[A-Za-z0-9_-]{8,}\.[^/]+$" {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location /assets/ {
      add_header Cache-Control "public, max-age=86400";
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }
}
