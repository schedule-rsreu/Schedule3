name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: schedule3-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/schedule-rsreu/schedule3:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build fresh Docker image
        id: build
        run: docker build --pull -t "$IMAGE" .

      - name: Smoke-test runtime image
        run: |
          container="$(docker run -d -p 127.0.0.1:3300:8080 "$IMAGE")"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3300/healthz; then break; fi
            sleep 1
          done
          docker exec "$container" nginx -t
          curl -fsS http://127.0.0.1:3300/healthz
          curl -fsS http://127.0.0.1:3300/ > /tmp/schedule3.html
          asset="$(grep -oE '/assets/[^"]+\.js' /tmp/schedule3.html | head -n1)"
          test -n "$asset"
          curl -fsS "http://127.0.0.1:3300$asset" >/dev/null
          curl -fsS http://127.0.0.1:3300/smoke-spa-route >/dev/null

      - name: Scan image with Trivy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.2 image --scanners vuln --exit-code 1 "$IMAGE"

      - name: Scan image with Grype
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/grype:v0.121.2 "docker:$IMAGE" -o json > grype.json
          jq -e '.matches | length == 0' grype.json

      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.21.3

      - name: Validate Helm chart before publishing
        run: helm lint charts/schedule3 --set-string image.tag=test
      - name: Publish checked immutable image
        run: docker push "$IMAGE"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Provision image pull secret
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER GHCR_USERNAME GHCR_PULL_TOKEN; do
            [ -n "$(printenv "$name")" ] || {
              echo "::error::$name is empty"
              exit 1
            }
          done

          registry_auth="$(printf '%s' "$GHCR_USERNAME:$GHCR_PULL_TOKEN" | base64 -w0)"
          docker_config="$(printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$registry_auth" | base64 -w0)"

          {
            printf 'apiVersion: v1\nkind: Namespace\nmetadata:\n  name: schedule-api\n---\n'
            printf 'apiVersion: v1\nkind: Secret\nmetadata:\n'
            printf '  name: ghcr-pull\n  namespace: schedule-api\n'
            printf 'type: kubernetes.io/dockerconfigjson\ndata:\n'
            printf '  .dockerconfigjson: %s\n' "$docker_config"
          } | ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
            "k3s kubectl apply -f -"

      - name: Deploy atomically
        if: vars.K3S_DEPLOY_ENABLED == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p dist
          helm package charts/schedule3 --destination dist
          archive="$(find dist -name 'schedule3-*.tgz' -print -quit)"
          remote_archive="/tmp/schedule3-${GITHUB_SHA}.tgz"
          scp -i ~/.ssh/id_ed25519 "$archive" \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_archive"
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu
             helm upgrade --install schedule3 '$remote_archive' \
               --kubeconfig /etc/rancher/k3s/k3s.yaml \
               --namespace schedule-api \
               --set-string image.tag='${GITHUB_SHA}' \
               --atomic --wait --timeout 10m
             rm -f '$remote_archive'"
