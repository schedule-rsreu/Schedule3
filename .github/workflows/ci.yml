name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      IMAGE: schedule3-check:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci && npm audit --audit-level=low

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build fresh Docker image
        id: build
        run: docker build --pull -t "$IMAGE" .
      - name: Smoke-test runtime image
        run: |
          container="$(docker run -d -p 127.0.0.1:3300:8080 "$IMAGE")"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3300/healthz; then break; fi
            sleep 1
          done
          docker exec "$container" nginx -t
          curl -fsS http://127.0.0.1:3300/healthz
          curl -fsS http://127.0.0.1:3300/ > /tmp/schedule3.html
          asset="$(grep -oE '/assets/[^"]+\.js' /tmp/schedule3.html | head -n1)"
          test -n "$asset"
          curl -fsS "http://127.0.0.1:3300$asset" >/dev/null
          curl -fsS http://127.0.0.1:3300/smoke-spa-route >/dev/null

      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.21.3

      - name: Validate Helm chart
        run: |
          helm lint charts/schedule3 --set-string image.tag=test
          helm template schedule3 charts/schedule3 \
            --namespace schedule-api --set-string image.tag=test >/dev/null
